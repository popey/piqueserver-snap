name: piqueserver
base: core24
version: '1.4.2'
summary: Ace of Spades 0.75 server
description: |
  Piqueserver is an Ace of Spades 0.75 server based on PySnip.
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  s390x:

parts:
  piqueserver:
    plugin: python
    source: https://github.com/piqueserver/piqueserver.git
    source-tag: v1.4.2
    override-build: |
      # Packaging patches dirty the checkout, but do not make this a new
      # upstream development release. Source remains pinned to the release tag.
      export SETUPTOOLS_SCM_PRETEND_VERSION="$SNAPCRAFT_PROJECT_VERSION"
      craftctl default
    override-pull: |
      craftctl default
      python3 - <<'PY'
      from pathlib import Path

      fixes = {
          Path("piqueserver/extensions.py"): "import importlib\nimport importlib.util\n",
          Path("piqueserver/map.py"): "import importlib\nimport importlib.util\n",
      }

      for path, replacement in fixes.items():
          text = path.read_text()
          text = text.replace("import importlib\n", replacement, 1)
          path.write_text(text)

      # Cython 3 rejects the unused float-to-int alpha assignment. This
      # function returns RGB only, so removing that assignment preserves output.
      path = Path("pyspades/vxl.pyx")
      text = path.read_text()
      unused_alpha = "    a = (((color & 0xFF000000) >> 24) / 128.0) * 255\n"
      if unused_alpha in text:
          assert text.count(unused_alpha) == 1
          assert "    return (r, g, b)" in text
          path.write_text(text.replace(unused_alpha, "", 1))
      PY
    build-packages:
      - build-essential
      - cargo
      - libenet-dev
      - libffi-dev
      - libjpeg-dev
      - libssl-dev
      - rustc
      - zlib1g-dev
    stage-packages:
      - ca-certificates
      - libenet7
      - libffi8
      - libjpeg8
      - libssl3t64
      - python3
      - zlib1g

  launcher:
    plugin: dump
    source: snap/local

apps:
  piqueserver:
    command: bin/launcher
    daemon: simple
    restart-condition: on-failure
    environment:
      PYTHONUNBUFFERED: "1"
    plugs:
      - network
      - network-bind
