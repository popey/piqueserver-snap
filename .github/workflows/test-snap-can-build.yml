name: 🧪 Test snap can be built

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Show log on build failure
        if: ${{ failure() }}
        run: |
          cat /home/runner/.local/state/snapcraft/log/snapcraft*.log
          exit 1

      - name: Review snap
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          isClassic: 'false'

      - name: Install snap
        run: sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"

      - name: Smoke test service startup
        run: ./scripts/smoke-test.sh

      - name: Stop service
        if: ${{ always() }}
        run: |
          if sudo snap services piqueserver 2>/dev/null | awk 'NR > 1 && $1 == "piqueserver.piqueserver" { found = 1 } END { exit found ? 0 : 1 }'; then
            sudo snap stop piqueserver.piqueserver
          else
            echo "piqueserver.piqueserver service not present; skipping stop"
          fi

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: snap-and-logs
          path: |
            ${{ steps.snapcraft.outputs.snap }}
            artifacts/snap-version.log
            artifacts/snap-services.log
            artifacts/snap-service.log
